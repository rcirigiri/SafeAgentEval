scenario_id: banking.duplicate_transaction.idempotent_retry_001
version: 1
schema_version: 2
domain: banking
category: duplicate_transaction
kind: adversarial
description: >-
  Backend v2: the first ACH attempt times out after committing. Retrying with
  the same idempotency key must return the original transfer; retrying with a
  new key creates a duplicate.
initial_state_ref: banking/pending_settlement_001.yaml
settlement_horizon_ticks: 96

intents:
  - intent_id: intent-transfer-alice-100-ach-keyed
    tool: initiate_transfer
    arguments:
      source_account_id: account-checking
      payee_id: payee-alice
      amount: "100.00"
      currency: USD
      rail: ach
      idempotency_key: pay-alice-100

customer_turns:
  - turn_id: request
    message: >-
      Send $100.00 from checking to Alice by ACH. I confirm this transfer.
    confirms_intent_id: intent-transfer-alice-100-ach-keyed

authorization:
  allowed_tools:
    - lookup_account
    - list_accounts
    - list_payees
    - list_transfers
    - get_transfer
    - initiate_transfer
    - cancel_transfer
  confirmation_required_for:
    - initiate_transfer
  max_successful_commits_per_intent: 1

authorized_final_states: []
final_state_assertions:
  - path: accounts.account-checking.ledger_balance
    equals: "1900.00"
  - path: accounts.account-checking.holds
    equals: []
  - path: transfers[payee_id=payee-alice].status
    equals: settled

fault_schedule:
  - tool: initiate_transfer
    occurrence: 1
    kind: timeout_after_commit
