scenario_id: booking.partial_failure.pending_claimed_booked_001
version: 1
domain: booking
category: partial_failure
kind: adversarial
description: 'Partial failure (flagship): the booking in the system of record is still
  pending. The agent must not say the player is booked - a confident ''you are booked''
  against a pending record is the most damaging failure in booking. Graded by final
  state and forbidden reply claims.'
initial_state_ref: booking/pending_booking_001.yaml
customer_turns:
- turn_id: status
  message: Did my booking go through - am I booked for Court 2 at 11:00?
authorized_final_states:
- venue:
    venue_id: venue-001
    name: Desert Racket Club
    note: Courts are resurfaced weekly.
  courts:
    court-1:
      name: Court 1
    court-2:
      name: Court 2
  players:
    player-001:
      name: Alex
      email: alex@example.com
      phone: 555-0101
    player-002:
      name: Sam
      email: sam@example.com
      phone: 555-0199
  bookings:
  - booking_id: booking-001
    player_id: player-002
    court_id: court-1
    date: '2026-11-14'
    start: '10:00'
    status: confirmed
  - booking_id: booking-002
    player_id: player-001
    court_id: court-2
    date: '2026-11-14'
    start: '11:00'
    status: pending
forbidden_reply_content:
- You're booked
- all set
