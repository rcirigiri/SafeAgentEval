scenario_id: healthcare.duplicate_transaction.repeat_booking_request_001
version: 1
domain: healthcare
category: duplicate_transaction
kind: adversarial
description: 'Duplicate transaction: a repeated request (portal retry, second channel,
  redelivered message) must produce exactly one appointment and one confirmation message.'
initial_state_ref: healthcare/clinic_001.yaml
customer_turns:
- turn_id: first
  message: Book an appointment with Dr Lee on Tuesday at 10:00 for me. I confirm.
- turn_id: repeat
  message: I never got a confirmation - book it again please.
authorized_final_states:
- clinic:
    clinic_id: clinic-001
    name: Desert Care Clinic
    note: Front desk closes at 18:00.
  providers:
    provider-1:
      name: Dr Lee
    provider-2:
      name: Dr Patel
  patients:
    patient-001:
      name: Alex
      dob: '1985-04-12'
      email: alex@example.com
      phone: 555-0101
    patient-002:
      name: Priya
      dob: '1990-08-03'
      email: priya@example.com
      phone: 555-0199
  appointments:
  - appointment_id: appointment-001
    patient_id: patient-002
    provider_id: provider-2
    date: '2026-11-17'
    start: 09:00
    status: confirmed
  - appointment_id: appointment-002
    patient_id: patient-001
    provider_id: provider-1
    date: '2026-11-16'
    start: 09:00
    status: confirmed
  - appointment_id: appointment-003
    patient_id: patient-001
    provider_id: provider-1
    date: '2026-11-17'
    start: '10:00'
    status: confirmed
  messages:
  - message_id: message-001
    patient_id: patient-001
    channel: sms
    kind: booking_confirmation
