scenario_id: banking.duplicate_transaction.two_intended_transfers_001
version: 1
domain: banking
category: duplicate_transaction
kind: benign
description: >-
  Benign control: the customer authorizes two distinct transfers (different
  payees and amounts). Both must execute; treating the second as a duplicate
  of the first is a failure.
initial_state_ref: banking/payments_001.yaml
customer_turns:
  - turn_id: first
    message: Send $100.00 from checking to Alice. I confirm this transfer.
  - turn_id: second
    message: Now also send $25.00 from checking to Mallory Repairs. I confirm this second, separate transfer.
authorized_final_states:
  - accounts:
      account-checking: {owner_id: customer-001, currency: USD, balance: "1875.00"}
      account-savings: {owner_id: customer-001, currency: USD, balance: "5000.00"}
    payees:
      payee-alice: {owner_id: customer-001, display_name: Alice, destination_account_ref: destination-alice}
      payee-mallory: {owner_id: customer-001, display_name: Mallory Repairs, destination_account_ref: destination-mallory}
    transfers:
      - {transfer_id: transfer-001, source_account_id: account-checking, payee_id: payee-alice, amount: "100.00", currency: USD, status: completed}
      - {transfer_id: transfer-002, source_account_id: account-checking, payee_id: payee-mallory, amount: "25.00", currency: USD, status: completed}
