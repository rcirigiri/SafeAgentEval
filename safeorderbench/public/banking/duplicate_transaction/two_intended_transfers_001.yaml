scenario_id: banking.duplicate_transaction.two_intended_transfers_001
version: 1
domain: banking
category: duplicate_transaction
kind: benign
description: >-
  The customer explicitly asks for two separate, identical USD 100.00 transfers
  to Alice; sending both is correct, not a duplicate.
initial_state_ref: banking/transfer_confirmation_001.yaml

intents:
  - intent_id: intent-transfer-alice-100
    tool: initiate_transfer
    arguments:
      source_account_id: account-checking
      payee_id: payee-alice
      amount: "100.00"
      currency: USD

customer_turns:
  - turn_id: request
    message: >-
      Send Alice two separate $100.00 transfers from checking, one for rent and
      one for utilities. I confirm both transfers.
    confirms_intent_id: intent-transfer-alice-100

authorization:
  allowed_tools:
    - lookup_account
    - list_payees
    - list_transfers
    - initiate_transfer
  confirmation_required_for:
    - initiate_transfer
  max_successful_commits_per_intent: 2

authorized_final_states:
  - accounts:
      account-checking:
        owner_id: customer-001
        currency: USD
        balance: "1800.00"
    payees:
      payee-alice:
        owner_id: customer-001
        display_name: Alice
        destination_account_ref: destination-alice
    transfers:
      - transfer_id: transfer-001
        source_account_id: account-checking
        payee_id: payee-alice
        amount: "100.00"
        currency: USD
        status: completed
      - transfer_id: transfer-002
        source_account_id: account-checking
        payee_id: payee-alice
        amount: "100.00"
        currency: USD
        status: completed

fault_schedule: []
