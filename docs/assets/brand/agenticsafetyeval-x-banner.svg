<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="agentic-safety-eval - State-verified safety evaluation for black-box AI agents">
  <defs>
    <linearGradient id="ase-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3C6C"/>
      <stop offset="1" stop-color="#0FA3A8"/>
    </linearGradient>
    <linearGradient id="ase-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2A4A"/>
      <stop offset="1" stop-color="#082038"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#ase-bg)"/>
  <!-- faint ledger lines, right side -->
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.05">
    <line x1="1080" y1="70" x2="1460" y2="70"/>
    <line x1="1080" y1="130" x2="1460" y2="130"/>
    <line x1="1080" y1="190" x2="1460" y2="190"/>
    <line x1="1080" y1="250" x2="1460" y2="250"/>
    <line x1="1080" y1="310" x2="1460" y2="310"/>
    <line x1="1080" y1="370" x2="1460" y2="370"/>
    <line x1="1080" y1="430" x2="1460" y2="430"/>
  </g>
  <!-- lockup, top-left (clear of the profile-photo overlap below) -->
  <g transform="translate(56 40) scale(0.62)">
    <rect x="28" y="26" width="184" height="156" rx="42" fill="url(#ase-g)"/>
    <path d="M76 182 L76 216 L118 182 Z" fill="url(#ase-g)"/>
    <path d="M72 94 L106 126 L170 62" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="74" y="144" width="92" height="11" rx="5.5" fill="#FFFFFF" opacity="0.95"/>
    <rect x="74" y="162" width="64" height="11" rx="5.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  <text x="228" y="118" font-family="Inter, Arial, sans-serif" font-size="41" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">agentic-safety-<tspan fill="#2BD4DA">eval</tspan></text>
  <text x="230" y="152" font-family="Inter, Arial, sans-serif" font-size="16.5" letter-spacing="1.8" fill="#9FB3C8">STATE-VERIFIED AGENT SAFETY EVALUATION</text>
  <!-- headline -->
  <text x="470" y="252" font-family="Inter, Arial, sans-serif" font-size="57" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF"><tspan fill="#2BD4DA">State-verified</tspan> safety evaluation</text>
  <text x="470" y="322" font-family="Inter, Arial, sans-serif" font-size="57" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">for black-box AI agents.</text>
  <!-- chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#D7E3EE">
    <rect x="470" y="366" width="368" height="42" rx="21" fill="none" stroke="#0FA3A8" stroke-width="1.5"/>
    <text x="654" y="394" text-anchor="middle">SafeOrderBench &#183; banking scenarios</text>
    <rect x="854" y="366" width="238" height="42" rx="21" fill="none" stroke="#0FA3A8" stroke-width="1.5"/>
    <text x="973" y="394" text-anchor="middle">Deterministic scoring</text>
    <rect x="1108" y="366" width="238" height="42" rx="21" fill="none" stroke="#0FA3A8" stroke-width="1.5"/>
    <text x="1227" y="394" text-anchor="middle">Open source &#183; Apache-2.0</text>
  </g>
  <text x="470" y="452" font-family="Inter, Arial, sans-serif" font-size="19" fill="#7E97AC">github.com/rcirigiri/agentic-safety-eval</text>
