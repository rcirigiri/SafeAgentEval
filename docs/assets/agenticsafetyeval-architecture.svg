<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 980" role="img" aria-label="AgenticSafetyEval architecture: inputs, harness, and outputs">
  <rect x="0" y="0" width="1640" height="980" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B3C6C"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0FA3A8"/>
    </marker>
  </defs>

  <text x="820" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0B3C6C">AgenticSafetyEval &#8212; State-Verified Agent Safety Evaluation</text>
  <text x="820" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#546B80">Grading what the system recorded, not what the agent said</text>

  <!-- column headers -->
  <text x="200" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#0B3C6C">INPUTS</text>
  <text x="820" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#0B3C6C">HARNESS (TRUSTED)</text>
  <text x="1435" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#0B3C6C">OUTPUTS</text>

  <!-- INPUTS -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="40" y="160" width="320" height="118" rx="14" fill="#EEF4FA" stroke="#0B3C6C" stroke-width="2"/>
    <text x="60" y="192" font-size="19" font-weight="700" fill="#0B3C6C">Scenario pack</text>
    <text x="60" y="219" font-size="15" fill="#33536E">Initial state (accounts, payees)</text>
    <text x="60" y="241" font-size="15" fill="#33536E">Customer turns + clarifications</text>
    <text x="60" y="263" font-size="15" fill="#33536E">Authorized final states &#183; forbidden replies</text>

    <rect x="40" y="300" width="320" height="104" rx="14" fill="#FFF3E6" stroke="#D97A1F" stroke-width="2"/>
    <text x="60" y="332" font-size="19" font-weight="700" fill="#9A5510">Agent under test (untrusted)</text>
    <text x="60" y="359" font-size="15" fill="#7A4A16">Black-box session: say(text) or HTTP</text>
    <text x="60" y="381" font-size="15" fill="#7A4A16">Executes its own tools internally</text>

    <rect x="40" y="426" width="320" height="118" rx="14" fill="#EEF4FA" stroke="#0B3C6C" stroke-width="2"/>
    <text x="60" y="458" font-size="19" font-weight="700" fill="#0B3C6C">Sandbox / system of record</text>
    <text x="60" y="485" font-size="15" fill="#33536E">StateProvider: seed &#183; snapshot &#183; reset</text>
    <text x="60" y="507" font-size="15" fill="#33536E">Ledger, EHR, CRM, payments rail</text>
    <text x="60" y="529" font-size="15" fill="#33536E">Synthetic data only &#183; no production</text>

    <rect x="40" y="566" width="320" height="96" rx="14" fill="#EEF4FA" stroke="#0B3C6C" stroke-width="2"/>
    <text x="60" y="598" font-size="19" font-weight="700" fill="#0B3C6C">Run configuration</text>
    <text x="60" y="625" font-size="15" fill="#33536E">Repeats, concurrency, pass-rate gate</text>
    <text x="60" y="647" font-size="15" fill="#33536E">provider_trust: harness / auditor / self</text>
  </g>

  <!-- HARNESS pipeline -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="480" y="160" width="680" height="502" rx="16" fill="#FFFFFF" stroke="#0B3C6C" stroke-width="2.5"/>

    <rect x="510" y="186" width="620" height="72" rx="10" fill="#0FA3A8"/>
    <text x="820" y="216" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">1 &#183; Seed &amp; verify</text>
    <text x="820" y="241" text-anchor="middle" font-size="14.5" fill="#E6FAFA">Seed read-back: abort unless snapshot = seeded state</text>

    <rect x="510" y="278" width="620" height="72" rx="10" fill="#0FA3A8"/>
    <text x="820" y="308" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">2 &#183; Drive the agent</text>
    <text x="820" y="333" text-anchor="middle" font-size="14.5" fill="#E6FAFA">Scripted turns in; replies recorded as untrusted claims</text>

    <rect x="510" y="370" width="620" height="72" rx="10" fill="#0FA3A8"/>
    <text x="820" y="400" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">3 &#183; Observe the record</text>
    <text x="820" y="425" text-anchor="middle" font-size="14.5" fill="#E6FAFA">Per-turn + final snapshots; hash-linked trace sealed</text>

    <rect x="510" y="462" width="620" height="72" rx="10" fill="#12805A"/>
    <text x="820" y="492" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">4 &#183; Grade deterministically (no LLM verdict)</text>
    <text x="820" y="517" text-anchor="middle" font-size="14.5" fill="#E4F5EC">Final state vs authorized states &#183; state invariants</text>

    <rect x="510" y="554" width="620" height="82" rx="10" fill="#12805A"/>
    <text x="820" y="584" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">5 &#183; Verify every claim</text>
    <text x="820" y="609" text-anchor="middle" font-size="14.5" fill="#E4F5EC">verified &#183; contradicted &#183; unverifiable vs state when spoken</text>
  </g>

  <!-- arrows inputs -> harness -->
  <g stroke="#0B3C6C" stroke-width="2.5" fill="none">
    <line x1="360" y1="219" x2="474" y2="219" marker-end="url(#arr)"/>
    <line x1="360" y1="352" x2="474" y2="314" marker-end="url(#arr)"/>
    <line x1="360" y1="485" x2="474" y2="406" marker-end="url(#arr)"/>
    <line x1="360" y1="614" x2="474" y2="560" marker-end="url(#arr)"/>
  </g>

  <!-- arrows harness -> outputs -->
  <g stroke="#0FA3A8" stroke-width="2.5" fill="none">
    <line x1="1160" y1="219" x2="1274" y2="219" marker-end="url(#arrT)"/>
    <line x1="1160" y1="352" x2="1274" y2="352" marker-end="url(#arrT)"/>
    <line x1="1160" y1="485" x2="1274" y2="485" marker-end="url(#arrT)"/>
    <line x1="1160" y1="595" x2="1274" y2="595" marker-end="url(#arrT)"/>
  </g>

  <!-- OUTPUTS -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="1280" y="160" width="320" height="118" rx="14" fill="#E9F7F0" stroke="#12805A" stroke-width="2"/>
    <text x="1300" y="192" font-size="19" font-weight="700" fill="#0E5C40">Verdict (RunResult)</text>
    <text x="1300" y="219" font-size="15" fill="#2E5B47">passed / failed &#8212; one rule, exit-coded</text>
    <text x="1300" y="241" font-size="15" fill="#2E5B47">Per-scenario, per-category results</text>
    <text x="1300" y="263" font-size="15" fill="#2E5B47">Pass rates over repeats</text>

    <rect x="1280" y="300" width="320" height="104" rx="14" fill="#E9F7F0" stroke="#12805A" stroke-width="2"/>
    <text x="1300" y="332" font-size="19" font-weight="700" fill="#0E5C40">Claim verdicts</text>
    <text x="1300" y="359" font-size="15" fill="#2E5B47">Each agent statement checked</text>
    <text x="1300" y="381" font-size="15" fill="#2E5B47">against recorded state</text>

    <rect x="1280" y="426" width="320" height="104" rx="14" fill="#E9F7F0" stroke="#12805A" stroke-width="2"/>
    <text x="1300" y="458" font-size="19" font-weight="700" fill="#0E5C40">Audit evidence</text>
    <text x="1300" y="485" font-size="15" fill="#2E5B47">Hash-linked trace &#183; saved records</text>
    <text x="1300" y="507" font-size="15" fill="#2E5B47">Re-performable by any auditor</text>

    <rect x="1280" y="552" width="320" height="110" rx="14" fill="#E9F7F0" stroke="#12805A" stroke-width="2"/>
    <text x="1300" y="584" font-size="19" font-weight="700" fill="#0E5C40">Decisions</text>
    <text x="1300" y="611" font-size="15" fill="#2E5B47">CI release gate (block / release)</text>
    <text x="1300" y="633" font-size="15" fill="#2E5B47">Vendor &amp; model comparisons</text>
  </g>

  <!-- bottom band -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="40" y="706" width="1560" height="118" rx="14" fill="#082038"/>
    <text x="70" y="742" font-size="17" font-weight="700" letter-spacing="1.5" fill="#2BD4DA">DESIGN INVARIANTS</text>
    <text x="70" y="774" font-size="16" fill="#D8E8F2">The agent is untrusted: its words are claims &#183; No model decides the verdict: LLM judges only measure, post-run &#183; Adversarial scenarios pair with benign controls, so refusing everything cannot pass</text>
    <text x="70" y="802" font-size="16" fill="#D8E8F2">Results are labeled by who operated the measuring instrument (provider_trust) &#183; Conformance certifies the integration, never that an agent is &#8220;safe&#8221;</text>
  </g>

  <text x="820" y="878" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#546B80">Interfaces: Agent Contract v1 (Profile C) &#183; SessionAgent.say(text) or HTTP &#183; StateProvider.seed / snapshot / reset</text>
  <text x="820" y="910" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#546B80">Reference pack: SafeOrderBench (banking) &#183; Enterprises author their own scenarios against their own systems</text>
  <text x="820" y="948" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8496A5">AgenticSafetyEval &#183; Open source, Apache-2.0 &#183; github.com/rcirigiri/agentic-safety-eval</text>
</svg>
