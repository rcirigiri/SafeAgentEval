<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" font-family="Arial, Helvetica, sans-serif">

  <rect x="0" y="0" width="1600" height="1020" fill="#FFFFFF"/>



  <!-- Title -->

  <text x="60" y="58" font-size="42" font-weight="bold" fill="#0B3C6C">AgentSafetyRecord</text>

  <text x="60" y="92" font-size="21" fill="#3D5A73">State-verified agent safety evaluation - grading what the system recorded, not what the agent said.</text>



  <!-- PROBLEM band -->

  <rect x="60" y="118" width="1480" height="128" rx="12" fill="#FDF0EC" stroke="#D96C4A" stroke-width="2"/>

  <text x="88" y="152" font-size="19" font-weight="bold" fill="#A33F1F">THE PROBLEM</text>

  <text x="88" y="184" font-size="22" fill="#333333">The agent says: <tspan font-weight="bold">"Done - $100 sent to Alice."</tspan></text>

  <text x="88" y="216" font-size="19" fill="#555555">From the chat alone, you cannot tell which world you are in:</text>

  <rect x="880" y="146" width="300" height="82" rx="8" fill="#FFFFFF" stroke="#7BA17D" stroke-width="2"/>

  <text x="1030" y="180" font-size="19" text-anchor="middle" fill="#2E5E33">World A: money actually</text>

  <text x="1030" y="206" font-size="19" text-anchor="middle" fill="#2E5E33">moved, exactly as asked</text>

  <rect x="1210" y="146" width="300" height="82" rx="8" fill="#FFFFFF" stroke="#C0504D" stroke-width="2"/>

  <text x="1360" y="180" font-size="19" text-anchor="middle" fill="#8C2F2B">World B: nothing ever</text>

  <text x="1360" y="206" font-size="19" text-anchor="middle" fill="#8C2F2B">happened - words only</text>



  <!-- FLOW -->

  <text x="60" y="292" font-size="19" font-weight="bold" fill="#0B3C6C">THE FRAMEWORK - FIVE STEPS</text>



  <!-- Box 1 -->

  <rect x="60" y="312" width="272" height="252" rx="10" fill="#EEF4F8" stroke="#0B3C6C" stroke-width="2"/>

  <text x="196" y="348" font-size="20" font-weight="bold" text-anchor="middle" fill="#0B3C6C">1  SCENARIO</text>

  <text x="84" y="386" font-size="17" fill="#222222">- Seed sandbox state</text>

  <text x="84" y="414" font-size="17" fill="#222222">(fake bank: $2,000)</text>

  <text x="84" y="448" font-size="17" fill="#222222">- Scripted customer</text>

  <text x="84" y="476" font-size="17" fill="#222222">turns</text>

  <text x="84" y="510" font-size="17" fill="#222222">- Authorized end states</text>

  <text x="84" y="538" font-size="17" fill="#222222">(the answer key)</text>



  <!-- Arrow 1 -->

  <polygon points="340,428 366,438 340,448" fill="#0B3C6C"/>



  <!-- Box 2 -->

  <rect x="374" y="312" width="272" height="252" rx="10" fill="#E6F7F7" stroke="#0FA3A8" stroke-width="2"/>

  <text x="510" y="348" font-size="20" font-weight="bold" text-anchor="middle" fill="#0B6E73">2  AGENT UNDER TEST</text>

  <text x="398" y="386" font-size="17" fill="#222222">- Real LLM (any model</text>

  <text x="398" y="414" font-size="17" fill="#222222">or vendor, black-box)</text>

  <text x="398" y="448" font-size="17" fill="#222222">- Replies to customer</text>

  <text x="398" y="482" font-size="17" fill="#222222">- Calls its own tools</text>

  <text x="398" y="510" font-size="17" fill="#222222">to change state</text>



  <!-- Arrow 2 -->

  <polygon points="654,428 680,438 654,448" fill="#0B3C6C"/>



  <!-- Box 3 -->

  <rect x="688" y="312" width="272" height="252" rx="10" fill="#EEF4F8" stroke="#0B3C6C" stroke-width="2"/>

  <text x="824" y="348" font-size="20" font-weight="bold" text-anchor="middle" fill="#0B3C6C">3  SYSTEM OF RECORD</text>

  <text x="712" y="386" font-size="17" fill="#222222">- Sandbox ledger -</text>

  <text x="712" y="414" font-size="17" fill="#222222">the ground truth</text>

  <text x="712" y="448" font-size="17" fill="#222222">- Snapshot after every</text>

  <text x="712" y="476" font-size="17" fill="#222222">turn + final snapshot</text>

  <text x="712" y="510" font-size="17" fill="#222222">- Seed read-back and</text>

  <text x="712" y="538" font-size="17" fill="#222222">probe verify the source</text>



  <!-- Arrow 3 -->

  <polygon points="968,428 994,438 968,448" fill="#0B3C6C"/>



  <!-- Box 4 -->

  <rect x="1002" y="312" width="272" height="252" rx="10" fill="#FFF4E0" stroke="#C98A1B" stroke-width="2"/>

  <text x="1138" y="340" font-size="20" font-weight="bold" text-anchor="middle" fill="#8A5E0B">4  DETERMINISTIC</text>

  <text x="1138" y="366" font-size="20" font-weight="bold" text-anchor="middle" fill="#8A5E0B">GRADING (CODE)</text>

  <text x="1026" y="402" font-size="17" fill="#222222">DID: final state equals</text>

  <text x="1026" y="430" font-size="17" fill="#222222">an authorized end state?</text>

  <text x="1026" y="464" font-size="17" fill="#222222">SAID: every claim found</text>

  <text x="1026" y="492" font-size="17" fill="#222222">in the snapshot from</text>

  <text x="1026" y="520" font-size="17" fill="#222222">when it was spoken?</text>



  <!-- Arrow 4 -->

  <polygon points="1282,428 1308,438 1282,448" fill="#0B3C6C"/>



  <!-- Box 5 -->

  <rect x="1316" y="312" width="224" height="252" rx="10" fill="#EAF5EA" stroke="#3E7C43" stroke-width="2"/>

  <text x="1428" y="348" font-size="20" font-weight="bold" text-anchor="middle" fill="#2E5E33">5  VERDICT</text>

  <text x="1340" y="386" font-size="17" fill="#222222">- PASS / FAIL per run</text>

  <text x="1340" y="420" font-size="17" fill="#222222">- Claim stamps:</text>

  <text x="1340" y="448" font-size="17" fill="#222222">verified / contra-</text>

  <text x="1340" y="476" font-size="17" fill="#222222">dicted / unverifiable</text>

  <text x="1340" y="510" font-size="17" fill="#222222">- Hash-linked trace</text>

  <text x="1340" y="538" font-size="17" fill="#222222">+ trust tier</text>



  <!-- Rule line under flow -->

  <rect x="60" y="584" width="1480" height="54" rx="8" fill="#0B3C6C"/>

  <text x="800" y="619" font-size="19" text-anchor="middle" fill="#FFFFFF">PASS = the actions were right <tspan font-weight="bold">AND</tspan> no claim was contradicted. No LLM decides the verdict - an extractor LLM only copies claims; code stamps them.</text>



  <!-- BENEFITS -->

  <text x="60" y="684" font-size="19" font-weight="bold" fill="#0B3C6C">WHY IT MATTERS - BENEFITS FOR A FIRST-TIME READER</text>



  <rect x="60" y="704" width="356" height="196" rx="10" fill="#FFFFFF" stroke="#B9C9D6" stroke-width="2"/>

  <text x="84" y="742" font-size="19" font-weight="bold" fill="#0B3C6C">Verdicts you can defend</text>

  <text x="84" y="774" font-size="17" fill="#333333">Pass/fail comes from the record,</text>

  <text x="84" y="800" font-size="17" fill="#333333">not a model's opinion - usable</text>

  <text x="84" y="826" font-size="17" fill="#333333">as a CI release gate for agents</text>

  <text x="84" y="852" font-size="17" fill="#333333">that change state.</text>



  <rect x="432" y="704" width="356" height="196" rx="10" fill="#FFFFFF" stroke="#B9C9D6" stroke-width="2"/>

  <text x="456" y="742" font-size="19" font-weight="bold" fill="#0B3C6C">Catches both failure kinds</text>

  <text x="456" y="774" font-size="17" fill="#333333">Wrong actions - wrong amount,</text>

  <text x="456" y="800" font-size="17" fill="#333333">wrong payee, duplicate, sent</text>

  <text x="456" y="826" font-size="17" fill="#333333">without confirmation - and false</text>

  <text x="456" y="852" font-size="17" fill="#333333">words: "done" that never happened.</text>



  <rect x="804" y="704" width="356" height="196" rx="10" fill="#FFFFFF" stroke="#B9C9D6" stroke-width="2"/>

  <text x="828" y="742" font-size="19" font-weight="bold" fill="#0B3C6C">Fair, comparable tests</text>

  <text x="828" y="774" font-size="17" fill="#333333">Same seed, script, and answer</text>

  <text x="828" y="800" font-size="17" fill="#333333">key for every agent. Swap the</text>

  <text x="828" y="826" font-size="17" fill="#333333">model or vendor; the test and</text>

  <text x="828" y="852" font-size="17" fill="#333333">the grading stay identical.</text>



  <rect x="1176" y="704" width="364" height="196" rx="10" fill="#FFFFFF" stroke="#B9C9D6" stroke-width="2"/>

  <text x="1200" y="742" font-size="19" font-weight="bold" fill="#0B3C6C">Audit-ready evidence</text>

  <text x="1200" y="774" font-size="17" fill="#333333">Every verdict traces to snapshots,</text>

  <text x="1200" y="800" font-size="17" fill="#333333">claim reasons, and a tamper-</text>

  <text x="1200" y="826" font-size="17" fill="#333333">evident trace - reviewers can</text>

  <text x="1200" y="852" font-size="17" fill="#333333">re-check any grade themselves.</text>



  <!-- Footer -->

  <text x="800" y="950" font-size="19" text-anchor="middle" fill="#3D5A73">One idea: the agent's words are claims; the ledger is the evidence. Works for any state-changing agent - banking, payments, booking, healthcare.</text>

  <text x="800" y="984" font-size="16" text-anchor="middle" fill="#7A8FA3">AgentSafetyRecord  github.com/rcirigiri/SafeAgentEval</text>

</svg>

