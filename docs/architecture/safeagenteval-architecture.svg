<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1300" viewBox="0 0 1760 1300" role="img" aria-labelledby="title desc">
  <title id="title">SafeAgentEval architecture</title>
  <desc id="desc">Execution flows left to right and top to bottom. Scoring receives one completed trace and runs three checks in parallel. Dashed boxes are planned, not implemented.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #17212b; }
      .zone { font-size: 22px; font-weight: 700; }
      .title { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 12px; fill: #263746; text-anchor: middle; }
      .label { font-size: 12px; fill: #263746; }
      .input-zone { fill: #f4f5f6; stroke: #737b82; stroke-width: 2; }
      .trusted-zone { fill: #e7f3fb; stroke: #2f6f9f; stroke-width: 2; }
      .untrusted-zone { fill: #fff1e2; stroke: #b96822; stroke-width: 2; }
      .score-zone { fill: #eff8e9; stroke: #5d8d43; stroke-width: 2; }
      .input { fill: #ffffff; stroke: #8a9299; stroke-width: 1.5; }
      .trusted { fill: #c5e2f4; stroke: #2f6f9f; stroke-width: 1.5; }
      .untrusted { fill: #ffd7ad; stroke: #b96822; stroke-width: 1.5; }
      .score { fill: #d9edcd; stroke: #5d8d43; stroke-width: 1.5; }
      .store { fill: #e7f3df; stroke: #5d8d43; stroke-width: 1.5; }
      .planned { fill: #f7f7f7; stroke: #9aa3ab; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .arrow { fill: none; stroke: #24323d; stroke-width: 1.8; marker-end: url(#arrow); }
      .both { fill: none; stroke: #24323d; stroke-width: 1.8; marker-start: url(#start); marker-end: url(#arrow); }
      .evidence { fill: none; stroke: #496879; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .certify { fill: none; stroke: #2f6f9f; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #5d8d43; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#24323d"/>
    </marker>
    <marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#24323d"/>
    </marker>
  </defs>
  <rect width="1760" height="1300" fill="#ffffff"/>

  <!-- Zone 1: Inputs -->
  <rect class="input-zone" x="20" y="16" width="300" height="604" rx="16"/>
  <text class="zone" x="40" y="48">1. Inputs</text>
  <rect class="input" x="40" y="70" width="260" height="520" rx="12"/>
  <text class="title" x="170" y="98">SafeOrderBench run</text>
  <text class="body" x="170" y="130">Scenario (schema v1 / v2)</text>
  <text class="body" x="170" y="152">Intents, authorization, commit cap</text>
  <text class="body" x="170" y="174">Authorized final states or</text>
  <text class="body" x="170" y="196">path assertions (v2)</text>
  <text class="body" x="170" y="234">Initial state</text>
  <text class="body" x="170" y="256">v1: one balance &#183; v2: accounts,</text>
  <text class="body" x="170" y="278">holds, payees, transfers, bank policy</text>
  <text class="body" x="170" y="316">Configuration</text>
  <text class="body" x="170" y="338">C0 / C2 implemented</text>
  <text class="body" x="170" y="360">C1 / C1+ planned</text>
  <text class="body" x="170" y="398">Fault schedule</text>
  <text class="body" x="170" y="420">Timeouts before / after commit</text>
  <text class="body" x="170" y="442">Seeded and replayable</text>
  <text class="body" x="170" y="480">16 banking scenarios shipped</text>
  <text class="body" x="170" y="502">(14 v1 + 2 native v2)</text>
  <text class="body" x="170" y="540">Validated before execution</text>

  <!-- Zone 2: Trusted core -->
  <rect class="trusted-zone" x="340" y="16" width="800" height="604" rx="16"/>
  <text class="zone" x="360" y="48">2. Trusted evaluation core</text>
  <rect class="trusted" x="370" y="110" width="180" height="84" rx="10"/>
  <text class="title" x="460" y="142">Validators</text>
  <text class="body" x="460" y="164">Scenario + state</text>
  <text class="body" x="460" y="182">v1 &#8594; v2 migration</text>
  <rect class="trusted" x="620" y="102" width="220" height="92" rx="10"/>
  <text class="title" x="730" y="136">Run orchestrator</text>
  <text class="body" x="730" y="160">Complete mediation</text>
  <text class="body" x="730" y="180">+ settlement loop (tick)</text>
  <rect class="trusted" x="620" y="232" width="220" height="68" rx="10"/>
  <text class="title" x="730" y="260">Scripted customer</text>
  <text class="body" x="730" y="282">Trusted confirmation</text>
  <rect class="trusted" x="620" y="338" width="220" height="84" rx="10"/>
  <text class="title" x="730" y="370">Authorization gate</text>
  <text class="body" x="730" y="394">C0 pass / C2 intent-bound</text>
  <text class="body" x="730" y="412">Blocks are recorded</text>
  <rect class="trusted" x="890" y="330" width="230" height="150" rx="10"/>
  <text class="title" x="1005" y="356">Domain backends</text>
  <text class="body" x="1005" y="378">DomainBackend protocol</text>
  <text class="body" x="1005" y="396">+ backends registry</text>
  <text class="body" x="1005" y="418">Banking v1 (Lite)</text>
  <text class="body" x="1005" y="436">Banking v2 (Full): accounts,</text>
  <text class="body" x="1005" y="454">holds, lifecycle, idempotency,</text>
  <text class="body" x="1005" y="472">tick() settlement</text>
  <rect class="trusted" x="620" y="460" width="220" height="72" rx="10"/>
  <text class="title" x="730" y="490">Fault scheduler</text>
  <text class="body" x="730" y="512">Seeded and replayable</text>
  <rect class="trusted" x="890" y="486" width="230" height="84" rx="10"/>
  <text class="title" x="1005" y="514">Append-only trace</text>
  <text class="body" x="1005" y="536">Hash-linked: replies, calls,</text>
  <text class="body" x="1005" y="554">decisions, diffs, settlements</text>
  <rect class="trusted" x="370" y="300" width="180" height="120" rx="10"/>
  <text class="title" x="460" y="330">Conformance suite</text>
  <text class="body" x="460" y="354">CON-01&#8230;CON-12</text>
  <text class="body" x="460" y="374">Lite / Full profiles</text>
  <text class="body" x="460" y="394">Banking v2 passes Full</text>
  <text class="body" x="460" y="412">(CON-11 probe-gated)</text>
  <rect class="planned" x="370" y="470" width="180" height="84" rx="10"/>
  <text class="title" x="460" y="498">Domain packs (planned)</text>
  <text class="body" x="460" y="520">Retail &#183; pharmacy &#183; travel</text>
  <text class="body" x="460" y="538">via the same protocol</text>

  <!-- Zone 3: Untrusted -->
  <rect class="untrusted-zone" x="1160" y="16" width="580" height="604" rx="16"/>
  <text class="zone" x="1180" y="48">3. Untrusted models</text>
  <rect class="untrusted" x="1230" y="102" width="300" height="110" rx="10"/>
  <text class="title" x="1380" y="132">Agent under test</text>
  <text class="body" x="1380" y="156">AgentAdapter: scripted reference /</text>
  <text class="body" x="1380" y="176">unsafe plans, HTTP adapter, custom</text>
  <text class="body" x="1380" y="196">module agents, Inspect task surface</text>
  <rect class="planned" x="1230" y="338" width="300" height="84" rx="10"/>
  <text class="title" x="1380" y="368">C1 / C1+ guard (planned)</text>
  <text class="body" x="1380" y="392">Model-based, advisory verdict only</text>
  <rect class="input" x="1230" y="470" width="300" height="84" rx="10"/>
  <text class="title" x="1380" y="498">No action authority</text>
  <text class="body" x="1380" y="520">Requests actions only; cannot</text>
  <text class="body" x="1380" y="538">alter state or trace</text>

  <!-- Arrows: execution -->
  <path class="arrow" d="M300 180 H370"/>
  <path class="arrow" d="M550 152 H620"/>
  <path class="both" d="M840 148 H905 V157 H1230"/>
  <path class="both" d="M730 194 V232"/>
  <path class="arrow" d="M730 300 V338"/>
  <path class="arrow" d="M840 391 H890"/>
  <path class="both" d="M840 338 V316 H1380 V338"/>
  <path class="arrow" d="M760 460 V445 H950 V480"/>
  <path class="arrow" d="M1050 480 V486"/>
  <path class="certify" d="M550 360 H600 V410 H890"/>
  <text class="label" x="742" y="222">turn</text>
  <text class="label" x="742" y="328">decision</text>
  <text class="label" x="1000" y="306">advisory verdict</text>
  <text class="label" x="985" y="462">result</text>
  <text class="label" x="610" y="404">certifies</text>

  <!-- Zone 4: Scoring -->
  <rect class="score-zone" x="20" y="644" width="1720" height="636" rx="16"/>
  <text class="zone" x="40" y="678">4. Parallel scoring and reporting</text>
  <rect class="trusted" x="50" y="700" width="1660" height="42" rx="10"/>
  <text class="title" x="880" y="728">Trusted evidence projections from the completed trace</text>
  <path class="evidence" d="M1005 570 V660 H880 V700"/>

  <rect class="score" x="50" y="820" width="300" height="140" rx="10"/>
  <text class="title" x="200" y="858">State scorer</text>
  <text class="body" x="200" y="884">Final-state correctness (exact</text>
  <text class="body" x="200" y="904">match or path assertions)</text>
  <text class="body" x="200" y="924">Settled + pending count toward cap</text>
  <text class="body" x="200" y="944">Unauthorized-action detection</text>

  <rect class="untrusted" x="410" y="802" width="250" height="52" rx="10"/>
  <text class="title" x="535" y="834">Claim extractor (LLM)</text>
  <rect class="score" x="400" y="876" width="270" height="110" rx="10"/>
  <text class="title" x="535" y="912">Claim verifier</text>
  <text class="body" x="535" y="938">Verified / settled /</text>
  <text class="body" x="535" y="958">contradicted / unverifiable</text>

  <rect class="untrusted" x="720" y="794" width="220" height="60" rx="10"/>
  <text class="title" x="830" y="818">Response-only judge</text>
  <text class="body" x="830" y="838">replies visibility</text>
  <rect class="untrusted" x="960" y="794" width="220" height="60" rx="10"/>
  <text class="title" x="1070" y="818">Trace-aware judges</text>
  <text class="body" x="1070" y="838">tool-call / full-trace visibility</text>
  <rect class="score" x="710" y="876" width="480" height="110" rx="10"/>
  <text class="title" x="950" y="912">Judge&#8211;state comparison</text>
  <text class="body" x="950" y="938">2&#215;2 matrix &#183; judge miss rate</text>
  <text class="body" x="950" y="958">P(state fail | judge pass) &#183; inter-judge &#954;</text>

  <rect class="score" x="1240" y="876" width="150" height="110" rx="10"/>
  <text class="title" x="1315" y="912">Aggregator</text>
  <text class="body" x="1315" y="938">Per-cell rates</text>
  <text class="body" x="1315" y="958">95% intervals</text>
  <rect class="score" x="1420" y="876" width="170" height="110" rx="10"/>
  <text class="title" x="1505" y="912">Reporting</text>
  <text class="body" x="1505" y="938">CLI report &#183; HTML trace</text>
  <text class="body" x="1505" y="958">viewer &#183; static site</text>

  <rect class="store" x="1620" y="820" width="110" height="190" rx="18"/>
  <text class="title" x="1675" y="858">Artifact</text>
  <text class="title" x="1675" y="880">store</text>
  <text class="body" x="1675" y="914">Run JSON</text>
  <text class="body" x="1675" y="934">Traces</text>
  <text class="body" x="1675" y="954">Scores</text>
  <text class="body" x="1675" y="974">Labels</text>

  <rect class="trusted" x="50" y="1060" width="700" height="90" rx="10"/>
  <text class="title" x="400" y="1092">Entry points</text>
  <text class="body" x="400" y="1116">safeagenteval CLI: run &#183; explain-scenario &#183; lint-scenario &#183; certify-agent</text>
  <text class="body" x="400" y="1136">certify-state-provider &#183; report &#183; view &#183; build-site &#8212; plus Docker and GitHub Action</text>
  <rect class="input" x="50" y="1178" width="560" height="30" rx="6"/>
  <text class="body" x="330" y="1198">White input &#8212; Blue trusted &#8212; Orange untrusted &#8212; Green scoring &#8212; Dashed planned</text>

  <path class="arrow" d="M200 742 V820"/>
  <path class="arrow" d="M535 742 V802"/>
  <path class="arrow" d="M830 742 V794"/>
  <path class="arrow" d="M1070 742 V794"/>
  <path class="arrow" d="M535 854 V876"/>
  <path class="arrow" d="M830 854 V876"/>
  <path class="arrow" d="M1070 854 V876"/>
  <path class="bus" d="M200 960 V1030 H1315 V986"/>
  <path class="bus" d="M535 986 V1030"/>
  <path class="bus" d="M950 986 V1030"/>
  <path class="arrow" d="M1390 931 H1420"/>
  <path class="arrow" d="M1590 915 H1620"/>
  <path class="arrow" d="M1675 1010 V1030 H1590"/>
  <text class="label" x="760" y="1054">Parallel score outputs</text>
</svg>
