[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "safeagenteval"
version = "0.1.0a0"
description = "State-aware safety evaluation for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Rammohan Srikanth Cirigiri" },
]
keywords = ["ai-agents", "evaluation", "safety", "tool-use"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
]
models = [
  "anthropic>=0.40,<1",
  "openai>=1.50,<3",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
safeagenteval = "safeagenteval.cli:app"

[project.entry-points."safeagenteval.backends"]
banking = "safeagenteval.backends.banking.backend:BankingBackend"
banking-v2 = "safeagenteval.backends.banking.backend_v2:BankingBackendV2"

[tool.hatch.build.targets.wheel]
packages = ["src/safeagenteval"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["safeagenteval"]
